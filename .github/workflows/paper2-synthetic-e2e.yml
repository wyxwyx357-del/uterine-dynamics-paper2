name: paper2-synthetic-e2e

on:
  push:
    branches:
      - codex/paper2-script11-e2e-test

jobs:
  synthetic-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run synthetic Doppler end-to-end test
        run: python -m unittest tests.test_doppler_end_to_end_unittest -v
